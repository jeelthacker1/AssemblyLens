# Deployment foundation; supply your built image and secret values before applying.
# Use managed PostgreSQL and S3. Keep one API replica until shared model storage is configured.
apiVersion: v1
kind: Namespace
metadata: {name: assemblylens}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: api-data, namespace: assemblylens}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: assemblylens}
spec:
  replicas: 1
  selector: {matchLabels: {app: assemblylens-api}}
  template:
    metadata: {labels: {app: assemblylens-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: ghcr.io/REPLACE_OWNER/assemblylens-api:REPLACE_COMMIT_SHA
          envFrom: [{secretRef: {name: assemblylens-runtime}}]
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: '500m', memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 30}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: api-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: assemblylens}
spec:
  selector: {app: assemblylens-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: assemblylens}
spec:
  replicas: 2
  selector: {matchLabels: {app: assemblylens-web}}
  template:
    metadata: {labels: {app: assemblylens-web}}
    spec:
      containers:
        - name: web
          image: ghcr.io/REPLACE_OWNER/assemblylens-web:REPLACE_COMMIT_SHA
          ports: [{containerPort: 3000}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          readinessProbe: {httpGet: {path: /, port: 3000}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 1000}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: assemblylens}
spec:
  selector: {app: assemblylens-web}
  ports: [{port: 3000, targetPort: 3000}]
