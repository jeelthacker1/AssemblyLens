name: assemblylens
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: assemblylens
      POSTGRES_DB: assemblylens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python tools/setup_env.py}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assemblylens"]
      interval: 5s
      retries: 20
  s3:
    image: rustfs/rustfs@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    volumes: ["objects:/data"]
    ports: ["127.0.0.1:9001:9001"]
  api:
    build: .
    command: ["/bin/sh", "-c", "python tools/init_storage.py && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://assemblylens:${POSTGRES_PASSWORD}@postgres:5432/assemblylens
      DEMO_MODE: ${DEMO_MODE:-0}
      API_KEYS_JSON: ${API_KEYS_JSON}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3010}
      S3_ENDPOINT: http://s3:9000
      S3_BUCKET: assemblylens
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      ENABLE_OUTBOX: ${ENABLE_OUTBOX:-0}
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]
    volumes: ["api-data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 20
  web:
    build:
      context: ./web
      args: {NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8010}"}
    ports: ["127.0.0.1:${WEB_PORT:-3010}:3000"]
    depends_on:
      api: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    profiles: [scale]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
  kafka:
    image: apache/kafka:3.9.1
    profiles: [scale]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes: ["kafka:/tmp/kraft-combined-logs"]
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    profiles: [scale]
    environment:
      CLICKHOUSE_DB: assemblylens
      CLICKHOUSE_USER: assemblylens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: ["clickhouse:/var/lib/clickhouse", "./infra/clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
  relay:
    build: ./relay
    profiles: [scale]
    environment:
      RELAY_DATABASE_URL: postgres://assemblylens:${POSTGRES_PASSWORD}@postgres:5432/assemblylens
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: assemblylens
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    depends_on: [api,kafka,redis,clickhouse]
    restart: unless-stopped
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    profiles: [ml]
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["mlflow:/mlflow"]
volumes:
  postgres:
  objects:
  api-data:
  redis:
  kafka:
  clickhouse:
  mlflow:
